# /etc/nginx/sites-available/todo.lingu.at
#
# Drop this in, then:
#   sudo ln -s /etc/nginx/sites-available/todo.lingu.at /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d todo.lingu.at
#
# certbot rewrites this file to add the certificate and the http→https redirect.

server {
  listen 80;
  listen [::]:80;
  server_name todo.lingu.at;

  # Before certbot runs, this is what answers. After, certbot replaces it with
  # a redirect to https.
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name todo.lingu.at;

  # --- certbot will manage these lines --------------------------------------
  # ssl_certificate     /etc/letsencrypt/live/todo.lingu.at/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/todo.lingu.at/privkey.pem;
  # include             /etc/letsencrypt/options-ssl-nginx.conf;
  # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  # --------------------------------------------------------------------------

  # The app is a small family list: keep the logs, cap the bodies.
  access_log /var/log/nginx/todo.lingu.at.access.log;
  error_log  /var/log/nginx/todo.lingu.at.error.log;
  client_max_body_size 1m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;

    # What the app reads for Secure cookies and for the login throttle.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  # The app shell is versioned by Vite, the icons and manifest are stable.
  location ~* ^/(assets|icons)/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The service worker must never be cached, or the phone keeps an old shell.
  location = /sw.js {
    proxy_pass http://127.0.0.1:8090;
    add_header Cache-Control "no-cache" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
